<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dolfei</title>
    <meta name="description" content="Worth waiting for.">

    <link rel="icon" type="image/svg+xml" href="assets/logo.svg">
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <main class="hero">

        <div class="logo-container">
            <img src="assets/logo.svg" alt="Dolfei Logo" class="logo">
        </div>

        <div class="headline">
            <div class="static">What if</div>

            <div class="dynamic-wrapper">
                <span id="dynamic" class="dynamic">
                    the future weren't fixed.
                </span>
            </div>
        </div>

    </main>

    <footer class="footer">&copy; Dolfei 2026</footer>

    <script>
        const phrases = [
            "the future weren't fixed.",
            "risk had a shape.",
            "certainty was measurable.",
            "patterns spoke first.",
            "probabilities had a voice.",
            "complexity became simple.",
            "every decision had context.",
            "uncertainty wasn't random."
        ];

        const dynamic = document.getElementById("dynamic");
        let index = 0;

        setInterval(() => {

            dynamic.classList.add("fade-out");

            setTimeout(() => {

                index = (index + 1) % phrases.length;
                dynamic.textContent = phrases[index];

                dynamic.classList.remove("fade-out");

            }, 250);

        }, 3200);
    </script>

</body>

</html>
